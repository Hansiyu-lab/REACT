apiVersion: apps/v1  
kind: Deployment  
metadata:  
  annotations:  
    kompose.cmd: kompose convert  
    kompose.version: 1.22.0 (955b78124)  
  creationTimestamp: null  
  labels:  
    io.kompose.service: reservation
    tier: cloud  
  name: reservation-cloud  
spec:  
  replicas: 1
  selector:  
    matchLabels:  
      io.kompose.service: reservation  
      tier: cloud
  strategy:  
    type: RollingUpdate  
    rollingUpdate:  
      maxSurge: 2  
      maxUnavailable: 1  
  template:  
    metadata:  
      annotations:  
        kompose.cmd: kompose convert  
        kompose.version: 1.22.0 (955b78124)  
        sidecar.istio.io/statsInclusionPrefixes: cluster.outbound,cluster_manager,listener_manager,http_mixer_filter,tcp_mixer_filter,server,cluster.xds-grp,listener,connection_manager  
        sidecar.istio.io/statsInclusionRegexps: http.*  
      creationTimestamp: null  
      labels:  
        io.kompose.service: reservation 
        tier: cloud 
    spec:
      nodeSelector:            # [新增配置] 核心修改点  
        zone: cloud            # 强制调度到云中心节点  
      affinity:  
        podAntiAffinity:  
          preferredDuringSchedulingIgnoredDuringExecution:  
          - weight: 100  
            podAffinityTerm:  
              labelSelector:  
                matchExpressions:  
                - key: io.kompose.service  
                  operator: In  
                  values:  
                  - reservation  
              topologyKey: kubernetes.io/hostname  
      containers:  
        - command:  
            - /go/bin/reservation  
          image: zw/hotelreservation:V5.0  
          imagePullPolicy: IfNotPresent  
          name: hotel-reserv-reservation  
          ports:  
            - containerPort: 8087  
          env:  
            - name: MEMC_TIMEOUT  
              value: "5"  
            - name: GC  
              value: "200"  
            - name: LOG_LEVEL  
              value: "ERROR" 
            - name: MEMC_MAX_IDLE_CONNS  
              value: "4096"
              
          resources:  
            requests:  
              memory: "512Mi"  
              cpu: "1000m"  
            limits:  
              memory: "1Gi"  
              cpu: "2000m"  
          livenessProbe:  
            tcpSocket:  
              port: 8087  
            initialDelaySeconds: 30  
            periodSeconds: 10  
            timeoutSeconds: 5  
            failureThreshold: 3  
          readinessProbe:  
            tcpSocket:  
              port: 8087  
            initialDelaySeconds: 5  
            periodSeconds: 5  
            timeoutSeconds: 3  
            failureThreshold: 2  
      restartPolicy: Always