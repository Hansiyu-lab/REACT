apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-cloud             # [修改] 名字加后缀
  labels:
    io.kompose.service: search   # [保留] 关键标签，用于 Service 识别
    tier: cloud                  # [新增] 辅助标签
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: search # [保留]
      tier: cloud                # [新增] 匹配自己的 Pod
  template:
    metadata:
      annotations:
        sidecar.istio.io/statsInclusionPrefixes: cluster.outbound,cluster_manager,listener_manager,http_mixer_filter,tcp_mixer_filter,server,cluster.xds-grp,listener,connection_manager
        sidecar.istio.io/statsInclusionRegexps: http.*
      labels:
        io.kompose.service: search # [保留] Service 靠这个标签找到 Pod
        tier: cloud                # [新增]
    spec:
      nodeSelector:                # [新增] 强制调度到云节点
        zone: cloud
      containers:
        - command:
            - /go/bin/search
          image: zw/hotelreservation:V5.0
          imagePullPolicy: IfNotPresent
          name: hotel-reserv-search
          ports:
            - containerPort: 8082
          resources:
            requests:
              memory: "1Gi"
              cpu: "2000m"
            limits:
              memory: "2Gi"
              cpu: "4000m"
      restartPolicy: Always