apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-edge              # [修改] 名字加后缀
  labels:
    io.kompose.service: search
    tier: edge                   # [新增]
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: search
      tier: edge
  template:
    metadata:
      annotations:
        sidecar.istio.io/statsInclusionPrefixes: cluster.outbound,cluster_manager,listener_manager,http_mixer_filter,tcp_mixer_filter,server,cluster.xds-grp,listener,connection_manager
        sidecar.istio.io/statsInclusionRegexps: http.*
      labels:
        io.kompose.service: search # [保留]
        tier: edge
    spec:
      nodeSelector:                # [新增] 强制调度到边缘节点
        zone: edge
      containers:
        - command:
            - /go/bin/search
          image: zw/hotelreservation:V5.0
          imagePullPolicy: IfNotPresent
          name: hotel-reserv-search
          ports:
            - containerPort: 8082
          resources:
            requests:
              memory: "1Gi"
              cpu: "2000m"
            limits:
              memory: "2Gi"
              cpu: "4000m"
      restartPolicy: Always