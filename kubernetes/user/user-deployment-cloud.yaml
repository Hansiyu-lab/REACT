apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-cloud               # [修改] 名字加后缀
  labels:
    io.kompose.service: user     # [保留] Service 靠这个标签找到 Pod
    tier: cloud                  # [新增] 辅助标签
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: user   # [保留]
      tier: cloud                # [新增]
  template:
    metadata:
      annotations:
        sidecar.istio.io/statsInclusionPrefixes: cluster.outbound,cluster_manager,listener_manager,http_mixer_filter,tcp_mixer_filter,server,cluster.xds-grp,listener,connection_manager
        sidecar.istio.io/statsInclusionRegexps: http.*
      labels:
        io.kompose.service: user # [保留]
        tier: cloud              # [新增]
    spec:
      nodeSelector:              # [新增] 强制调度到云节点
        zone: cloud
      containers:
        - command:
            - /go/bin/user
          image: zw/hotelreservation:V5.0
          imagePullPolicy: IfNotPresent
          name: hotel-reserv-user
          ports:
            - containerPort: 8086
          resources:
            requests:
              cpu: 200m
            limits:
              cpu: 1000m
      restartPolicy: Always